name: Claude

# Skriv @claude i et issue (titel eller tekst), en issue-kommentar eller en PR-review, så
# svarer Claude og kan lave ændringer på en branch og åbne en PR. Kræver secret
# CLAUDE_CODE_0AUTH_TOKEN (i environment "Production") og at Claude GitHub-appen har adgang til repoet.
on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    environment: Production     # CLAUDE_CODE_0AUTH_TOKEN ligger som environment-secret
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Same toolchain as CI, so Claude can build and test what it changes.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_0AUTH_TOKEN }}
          claude_args: |
            --allowed-tools "Bash(dotnet restore),Bash(dotnet build:*),Bash(dotnet test:*),Bash(npm ci --prefix web),Bash(npm --prefix web run lint),Bash(npm --prefix web run build)"
